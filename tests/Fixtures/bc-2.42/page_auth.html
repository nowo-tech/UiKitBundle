<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
            <script src="/bundles/nowouikit/js/nowo-ui-theme-boot.js" data-nowo-ui-theme-boot></script>

                    <link rel="stylesheet" href="/bundles/nowouikit/css/nowo-ui.css">
    </head>
<body class="nowo-ui-body">
            <div class="nowo-ui-page nowo-ui-page--guest">
        <main class="nowo-ui-content" id="nowo-ui-content">
                                                                                            <div class="nowo-ui-flash nowo-ui-flash--success alert alert-success" role="alert">Saved.</div>
    
                                        <section class="nowo-ui-auth-panel card" data-nowo-ui-page="auth" data-nowo-ui-region="panel" data-probe="p">
        <div class="nowo-ui-card__body card-body">
            <p class="nowo-ui-auth-panel__brand">Acme</p>            <h1 class="nowo-ui-page-header__title h3 mb-1">Sign in</h1>
            <p class="nowo-ui-page-header__intro mb-0">Use your account.</p>            <div class="nowo-ui-flash nowo-ui-flash--error alert alert-danger" role="alert">No items found.</div>                                                                <form name="login" method="post" class="nowo-ui-form" data-nowo-ui-region="form">
    
                                                                            <div><label for="login_username">Username</label><input type="text" id="login_username" name="login[username]" /></div>
                                <div><label for="login_password">Password</label><input type="password" id="login_password" name="login[password]" /></div>
            
                                                <div class="nowo-ui-form__actions d-flex flex-wrap gap-2">
                                                            <button type="submit" class="nowo-ui-btn nowo-ui-btn--primary btn btn-primary">Submit</button>
                                                    </div>
                        </form>

                                                </div>
                            <footer class="nowo-ui-auth-panel__footer">                                                <ul class="nowo-ui-auth-panel__links">
                                                    <li><a href="/reset">Forgot password?</a></li>
                                            </ul>
                                    </footer>
            </section>
        </main>
            </div>
