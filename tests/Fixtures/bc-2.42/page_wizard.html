<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup</title>
            <script src="/bundles/nowouikit/js/nowo-ui-theme-boot.js" data-nowo-ui-theme-boot></script>

                    <link rel="stylesheet" href="/bundles/nowouikit/css/nowo-ui.css">
    </head>
<body class="nowo-ui-body">
            <div class="nowo-ui-page nowo-ui-page--admin">
                <main class="nowo-ui-content" id="nowo-ui-content">
                            <div class="nowo-ui-page-header d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3" data-nowo-ui-region="header">
    <div class="nowo-ui-page-header__text">                <nav class="nowo-ui-breadcrumbs" aria-label="Breadcrumb">
        <ol class="nowo-ui-breadcrumbs__list">
                            <li class="nowo-ui-breadcrumbs__item">                                            <a class="nowo-ui-breadcrumbs__link" href="/">Home</a>
                                    </li>
                            <li class="nowo-ui-breadcrumbs__item"><span class="nowo-ui-breadcrumbs__separator" aria-hidden="true">/</span>                                            <span class="nowo-ui-breadcrumbs__current" aria-current="page">Setup</span>
                                    </li>
                    </ol>
    </nav>

                                <h1 class="nowo-ui-page-header__title h3 mb-1">Setup</h1>
                                <p class="nowo-ui-page-header__intro">Every item of the catalogue</p>
            </div>
        </div>


                                                                                <div class="nowo-ui-flash nowo-ui-flash--success alert alert-success" role="alert">Saved.</div>
    
                                    <div class="nowo-ui-wizard-page" data-nowo-ui-page="wizard" data-probe="p">
        <ol class="nowo-ui-wizard-steps" aria-label="Steps" data-nowo-ui-region="steps">
                                            <li class="nowo-ui-wizard-steps__item nowo-ui-wizard-steps__item--done"><a href="/setup/account">Account</a></li>
                                            <li class="nowo-ui-wizard-steps__item nowo-ui-wizard-steps__item--active nowo-ui-wizard-steps__item--current" aria-current="step"><span>Storage</span></li>
                                            <li class="nowo-ui-wizard-steps__item nowo-ui-wizard-steps__item--upcoming"><span>Done</span></li>
                    </ol>
        <p class="nowo-ui-wizard-page__progress">Step 2 of 3</p>
        <section class="nowo-ui-card card" data-nowo-ui-region="step">
            <div class="nowo-ui-card__body card-body">
                                                            <form name="storage" method="post" class="nowo-ui-form" data-nowo-ui-region="form">
                        <div><label for="storage_path">Path</label><input type="text" id="storage_path" name="storage[path]" /></div>
                <div class="nowo-ui-form__actions d-flex flex-wrap gap-2">
                    <a class="nowo-ui-btn nowo-ui-btn--secondary btn btn-outline-secondary" href="/setup/account">Back</a>
                <button type="submit" class="nowo-ui-btn nowo-ui-btn--primary btn btn-primary">Next</button>
    </div>
</form>

                                                </div>
        </section>
    </div>
        </main>
            </div>
                            <script src="/bundles/nowouikit/js/nowo-ui-modal.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-confirm.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-dialog.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-toast.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-tabs.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-theme.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-popover.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-segmented.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-autosubmit.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-avatar.js" defer></script>
