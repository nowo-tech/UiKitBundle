<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders</title>
            <script src="/bundles/nowouikit/js/nowo-ui-theme-boot.js" data-nowo-ui-theme-boot></script>

                    <link rel="stylesheet" href="/bundles/nowouikit/css/nowo-ui.css">
    </head>
<body class="nowo-ui-body">
            <div class="nowo-ui-page nowo-ui-page--admin">
                <main class="nowo-ui-content" id="nowo-ui-content">
                            <div class="nowo-ui-page-header d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3" data-nowo-ui-region="header">
    <div class="nowo-ui-page-header__text">            
                                <h1 class="nowo-ui-page-header__title h3 mb-1">Orders</h1>
            </div>
        </div>


                                                                                <div class="nowo-ui-flash nowo-ui-flash--success alert alert-success" role="alert">Saved.</div>
    
                                <section class="nowo-ui-list-page" data-nowo-ui-page="list">
                                    <form name="filters" method="get" class="nowo-ui-filters nowo-ui-search d-grid gap-3 mb-3" role="search" data-nowo-ui-filters="" data-nowo-ui-region="filters">
                                                                                                                                                                                                                                                                                                                                                                                        <div class="nowo-ui-filters__field nowo-ui-filters__field--lg app-row"><label for="filters_q">Q</label><input type="search" id="filters_q" name="filters[q]" class="nowo-ui-input form-control app-search" data-x="1" placeholder="Search orders" value="abc" /></div>
                                                                                                                                                                                                                                                                                                                                                                    <div class="nowo-ui-filters__field nowo-ui-filters__field--sm"><label for="filters_status">Status</label><select id="filters_status" name="filters[status]" class="nowo-ui-input"><option value="">Any</option><option value="open">Open</option></select></div>
                                                                                                                                                                                <div class="nowo-ui-filters__field"><label for="filters_mine">Mine</label><input type="checkbox" id="filters_mine" name="filters[mine]" value="1" /></div>
                <div class="nowo-ui-filters__actions d-flex flex-wrap align-items-end gap-2">
                                                <button type="submit" class="nowo-ui-btn nowo-ui-btn--primary btn btn-primary nowo-ui-filters__submit" data-testid="apply"><i class="bi bi-funnel" aria-hidden="true"></i>
                <span class="nowo-ui-action__label">Go</span></button>
                                                                                            <a class="nowo-ui-btn nowo-ui-btn--secondary btn btn-outline-secondary nowo-ui-action--close" href="/orders">            <i class="bi bi-x-lg" aria-hidden="true"></i>
<span class="nowo-ui-action__label">Reset</span></a>
    
                                                                                                    <a class="nowo-ui-btn nowo-ui-btn--secondary btn btn-outline-secondary nowo-ui-action--export" href="/orders.csv">            <i class="bi bi-download" aria-hidden="true"></i>
<span class="nowo-ui-action__label">Export</span></a>
    
                            <div class="nowo-ui-filters__header-actions" data-nowo-ui-region="header-actions">
                                                                                                            <a class="nowo-ui-btn nowo-ui-btn--primary btn btn-primary nowo-ui-action--create" href="/new">            <i class="bi bi-plus-lg" aria-hidden="true"></i>
<span class="nowo-ui-action__label">New</span></a>
    
                            </div>
            </div>
</form>

                                                                                                                                                <div class="nowo-ui-table-wrap table-responsive" data-nowo-ui-region="table" data-nowo-ui-responsive="cards">
    <table class="nowo-ui-table nowo-ui-table--striped table table-striped table-hover align-middle nowo-ui-table--cards" aria-label="Orders">
                <thead class="nowo-ui-table__head">
            <tr class="nowo-ui-table__head-row">
                                                                                                                                                                <th scope="col" class="nowo-ui-table__head-cell nowo-ui-cell--start">name</th>
                                                                                                    </tr>
        </thead>
        <tbody>
                            <tr class="nowo-ui-table__row">
                                                                                                                                                                        <td class="nowo-ui-table__cell nowo-ui-cell--start" data-label="name">A</td>
                                                                                                                        </tr>
                    </tbody>
    </table>
</div>

                                </section>
        </main>
            </div>
                            <script src="/bundles/nowouikit/js/nowo-ui-modal.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-confirm.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-dialog.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-toast.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-tabs.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-theme.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-popover.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-segmented.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-autosubmit.js" defer></script>
    <script src="/bundles/nowouikit/js/nowo-ui-avatar.js" defer></script>

            </body>
</html>
